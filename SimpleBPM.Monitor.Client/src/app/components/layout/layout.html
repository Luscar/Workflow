<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <rect width="28" height="28" rx="6" fill="#3b82f6"/>
        <path d="M8 10h4v4H8zM16 10h4v4h-4zM12 16h4v4h-4z" fill="white" opacity="0.9"/>
        <path d="M12 12L14 14M16 12L14 14" stroke="white" stroke-width="1.5" opacity="0.6"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">SimpleBPM</span>
        <span class="brand-sub">Monitor</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Dashboard</span>
      </a>
      <a routerLink="/definitions" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span>Definitions</span>
      </a>
      <a routerLink="/instances" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <span>Instances</span>
      </a>
      <a routerLink="/audit" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>Audit Log</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="env-badge">Production</div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Notifications Toast -->
  <div class="toast-container">
    @for (n of notifications; track n.id) {
      <div class="toast toast-{{ n.type }}" (click)="dismissNotification(n.id)">
        <span class="toast-icon">
          @switch (n.type) {
            @case ('success') { &#10003; }
            @case ('error') { &#10007; }
            @case ('warning') { &#9888; }
            @case ('info') { &#9432; }
          }
        </span>
        <span>{{ n.message }}</span>
      </div>
    }
  </div>
</div>
