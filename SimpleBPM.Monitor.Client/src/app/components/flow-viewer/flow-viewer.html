@if (definition && definition.nodes.length > 0) {
  <div class="flow-container" #svgContainer>
    <svg [attr.width]="svgWidth" [attr.height]="svgHeight" class="flow-svg">
      <defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
          <polygon points="0 0, 8 3, 0 6" fill="var(--color-text-muted)"/>
        </marker>
        <marker id="arrowhead-active" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
          <polygon points="0 0, 8 3, 0 6" fill="#22c55e"/>
        </marker>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- Edges -->
      @for (edge of renderedEdges; track edge.path) {
        <path [attr.d]="edge.path"
              fill="none"
              stroke="var(--color-text-muted)"
              stroke-width="1.5"
              marker-end="url(#arrowhead)"
              opacity="0.5"/>
        @if (edge.label) {
          <text [attr.x]="(edge.fromX + edge.toX) / 2"
                [attr.y]="(edge.fromY + edge.toY) / 2 - 8"
                fill="var(--color-warning)"
                font-size="11"
                font-weight="600"
                text-anchor="middle">
            {{ edge.label }}
          </text>
        }
      }

      <!-- Nodes -->
      @for (node of renderedNodes; track node.id) {
        <g [attr.class]="getNodeClass(node)">
          <!-- Node background -->
          <rect [attr.x]="node.x"
                [attr.y]="node.y"
                [attr.width]="node.width"
                [attr.height]="node.height"
                rx="6"
                [attr.fill]="node.isActive ? 'rgba(34,197,94,0.15)' : node.isFailed ? 'rgba(239,68,68,0.15)' : 'var(--color-bg)'"
                [attr.stroke]="node.isActive ? '#22c55e' : node.isFailed ? '#ef4444' : node.color"
                [attr.stroke-width]="node.isActive || node.isFailed ? 2 : 1"
                [attr.filter]="node.isActive ? 'url(#glow)' : null"
                [attr.opacity]="isExecuted(node.id) ? 1 : 0.8"/>

          <!-- Node type icon badge -->
          <rect [attr.x]="node.x + 8"
                [attr.y]="node.y + (node.height - 24) / 2"
                width="24" height="24"
                rx="4"
                [attr.fill]="node.color"
                opacity="0.2"/>
          <text [attr.x]="node.x + 20"
                [attr.y]="node.y + node.height / 2 + 5"
                [attr.fill]="node.color"
                font-size="12"
                font-weight="700"
                text-anchor="middle">
            {{ node.icon }}
          </text>

          <!-- Node name -->
          <text [attr.x]="node.x + 42"
                [attr.y]="node.y + node.height / 2 + 5"
                fill="var(--color-text)"
                font-size="12"
                font-weight="500">
            {{ node.name }}
          </text>

          <!-- Start indicator -->
          @if (node.isStart) {
            <circle [attr.cx]="node.x - 8"
                    [attr.cy]="node.y + node.height / 2"
                    r="5"
                    fill="var(--color-success)"/>
          }

          <!-- Active pulse -->
          @if (node.isActive) {
            <circle [attr.cx]="node.x + node.width + 8"
                    [attr.cy]="node.y + node.height / 2"
                    r="5"
                    fill="#22c55e"
                    class="pulse-dot"/>
          }
        </g>
      }
    </svg>
  </div>

  <!-- Legend -->
  <div class="flow-legend">
    <div class="legend-item"><span class="legend-dot" style="background: #3b82f6;"></span> Business</div>
    <div class="legend-item"><span class="legend-dot" style="background: #f59e0b;"></span> Decision</div>
    <div class="legend-item"><span class="legend-dot" style="background: #22c55e;"></span> Interactive</div>
    <div class="legend-item"><span class="legend-dot" style="background: #06b6d4;"></span> WaitDate</div>
    <div class="legend-item"><span class="legend-dot" style="background: #8b5cf6;"></span> WaitSignal</div>
    <div class="legend-item"><span class="legend-dot" style="background: #ec4899;"></span> SubProcess</div>
  </div>
} @else {
  <div class="empty-state">
    <h4>No flow to display</h4>
    <p>Select a process definition to visualize its flow</p>
  </div>
}
